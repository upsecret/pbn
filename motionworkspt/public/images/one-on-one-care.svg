<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f4f0"/>
      <stop offset="100%" style="stop-color:#ede8e0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="260" fill="url(#bg-grad)"/>

  <!-- Floating medical cross icons -->
  <g opacity="0.35" fill="#f5c99a">
    <rect x="30" y="20" width="6" height="18" rx="1"/>
    <rect x="24" y="26" width="18" height="6" rx="1"/>
    <rect x="330" y="30" width="5" height="15" rx="1"/>
    <rect x="325" y="35" width="15" height="5" rx="1"/>
    <rect x="60" y="180" width="4" height="12" rx="1"/>
    <rect x="56" y="184" width="12" height="4" rx="1"/>
    <rect x="355" y="150" width="5" height="15" rx="1"/>
    <rect x="350" y="155" width="15" height="5" rx="1"/>
    <rect x="180" y="15" width="4" height="12" rx="1"/>
    <rect x="176" y="19" width="12" height="4" rx="1"/>
    <rect x="300" y="190" width="4" height="12" rx="1"/>
    <rect x="296" y="194" width="12" height="4" rx="1"/>
  </g>

  <!-- Treatment table -->
  <!-- Table top surface -->
  <rect x="100" y="155" width="200" height="18" rx="4" fill="#8B7355"/>
  <!-- Table legs -->
  <rect x="115" y="173" width="10" height="50" rx="2" fill="#7a6347"/>
  <rect x="275" y="173" width="10" height="50" rx="2" fill="#7a6347"/>
  <!-- Table cross-bar -->
  <rect x="115" y="205" width="170" height="6" rx="2" fill="#7a6347"/>

  <!-- Patient silhouette - seated on table -->
  <!-- Patient torso -->
  <ellipse cx="235" cy="140" rx="18" ry="22" fill="#6B6B6B"/>
  <!-- Patient head -->
  <circle cx="235" cy="112" r="16" fill="#6B6B6B"/>
  <!-- Patient neck -->
  <rect x="229" y="126" width="12" height="16" fill="#6B6B6B"/>
  <!-- Patient legs dangling -->
  <rect x="218" y="171" width="12" height="35" rx="4" fill="#6B6B6B" transform="rotate(8, 224, 171)"/>
  <rect x="237" y="172" width="12" height="35" rx="4" fill="#6B6B6B" transform="rotate(-5, 243, 172)"/>
  <!-- Patient feet -->
  <ellipse cx="222" cy="207" rx="9" ry="5" fill="#5a5a5a" transform="rotate(8, 222, 207)"/>
  <ellipse cx="245" cy="205" rx="9" ry="5" fill="#5a5a5a" transform="rotate(-5, 245, 205)"/>
  <!-- Patient arms resting -->
  <path d="M217 143 Q200 158 205 168" stroke="#6B6B6B" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M253 143 Q268 155 262 165" stroke="#6B6B6B" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Therapist silhouette - standing beside table -->
  <!-- Therapist body/torso -->
  <ellipse cx="155" cy="130" rx="17" ry="26" fill="#4A4A4A"/>
  <!-- Therapist head -->
  <circle cx="155" cy="97" r="15" fill="#4A4A4A"/>
  <!-- Therapist neck -->
  <rect x="149" y="111" width="12" height="15" fill="#4A4A4A"/>
  <!-- Therapist legs -->
  <rect x="143" y="155" width="12" height="60" rx="4" fill="#4A4A4A"/>
  <rect x="158" y="155" width="12" height="60" rx="4" fill="#4A4A4A"/>
  <!-- Therapist feet -->
  <ellipse cx="149" cy="218" rx="12" ry="5" fill="#3a3a3a"/>
  <ellipse cx="164" cy="218" rx="12" ry="5" fill="#3a3a3a"/>
  <!-- Therapist arm extending toward patient -->
  <path d="M168 122 Q185 135 205 148" stroke="#4A4A4A" stroke-width="11" fill="none" stroke-linecap="round"/>
  <!-- Therapist other arm with clipboard -->
  <path d="M142 122 Q128 132 120 145" stroke="#4A4A4A" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Clipboard in therapist's hand -->
  <rect x="103" y="140" width="28" height="36" rx="3" fill="#E8751A"/>
  <rect x="106" y="143" width="22" height="30" rx="2" fill="#fff3e0"/>
  <!-- Clipboard clip -->
  <rect x="112" y="137" width="10" height="7" rx="2" fill="#c96010"/>
  <!-- Clipboard lines -->
  <line x1="109" y1="150" x2="125" y2="150" stroke="#E8751A" stroke-width="1.5"/>
  <line x1="109" y1="155" x2="125" y2="155" stroke="#E8751A" stroke-width="1.5"/>
  <line x1="109" y1="160" x2="120" y2="160" stroke="#E8751A" stroke-width="1.5"/>
  <line x1="109" y1="165" x2="123" y2="165" stroke="#E8751A" stroke-width="1.5"/>

  <!-- Therapist hand near patient -->
  <circle cx="207" cy="149" r="7" fill="#4A4A4A"/>

  <!-- Label -->
  <text x="386" y="248" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E8751A" text-anchor="end">1:1 Care</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#d4eaf7"/>
    </linearGradient>
    <linearGradient id="window-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff8f0"/>
      <stop offset="100%" style="stop-color:#fff3e0"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="400" height="280" fill="url(#sky-grad)"/>

  <!-- Cloud 1 -->
  <g opacity="0.9" fill="white">
    <ellipse cx="80" cy="55" rx="35" ry="18"/>
    <ellipse cx="60" cy="60" rx="22" ry="14"/>
    <ellipse cx="105" cy="60" rx="22" ry="14"/>
  </g>
  <!-- Cloud 2 (smaller) -->
  <g opacity="0.75" fill="white">
    <ellipse cx="310" cy="40" rx="28" ry="14"/>
    <ellipse cx="293" cy="44" rx="18" ry="10"/>
    <ellipse cx="330" cy="44" rx="18" ry="10"/>
  </g>

  <!-- Ground / parking lot -->
  <rect x="0" y="215" width="400" height="65" fill="#c8c8c8"/>
  <!-- Parking lot lines -->
  <g stroke="white" stroke-width="1.5" opacity="0.6">
    <line x1="60" y1="220" x2="60" y2="275"/>
    <line x1="100" y1="220" x2="100" y2="275"/>
    <line x1="140" y1="220" x2="140" y2="275"/>
    <line x1="260" y1="220" x2="260" y2="275"/>
    <line x1="300" y1="220" x2="300" y2="275"/>
    <line x1="340" y1="220" x2="340" y2="275"/>
  </g>

  <!-- Cars in parking lot -->
  <!-- Car 1 -->
  <g>
    <rect x="65" y="230" width="30" height="14" rx="3" fill="#5a5a5a"/>
    <rect x="69" y="225" width="22" height="10" rx="2" fill="#4a4a4a"/>
    <circle cx="70" cy="244" r="4" fill="#333"/>
    <circle cx="90" cy="244" r="4" fill="#333"/>
  </g>
  <!-- Car 2 -->
  <g>
    <rect x="262" y="230" width="30" height="14" rx="3" fill="#6a6a6a"/>
    <rect x="266" y="225" width="22" height="10" rx="2" fill="#5a5a5a"/>
    <circle cx="267" cy="244" r="4" fill="#333"/>
    <circle cx="287" cy="244" r="4" fill="#333"/>
  </g>

  <!-- Building main structure -->
  <rect x="50" y="95" width="300" height="125" rx="3" fill="#f0f0f0"/>

  <!-- Building roof/top edge detail -->
  <rect x="45" y="90" width="310" height="10" rx="2" fill="#e0e0e0"/>
  <rect x="42" y="85" width="316" height="8" rx="2" fill="#d8d8d8"/>

  <!-- Building facade brickwork suggestion (subtle) -->
  <g stroke="#e4e4e4" stroke-width="0.5" opacity="0.6">
    <line x1="50" y1="115" x2="350" y2="115"/>
    <line x1="50" y1="135" x2="350" y2="135"/>
    <line x1="50" y1="155" x2="350" y2="155"/>
    <line x1="50" y1="175" x2="350" y2="175"/>
    <line x1="50" y1="195" x2="350" y2="195"/>
  </g>

  <!-- Large windows - left side -->
  <rect x="65" y="108" width="60" height="70" rx="3" fill="url(#window-grad)" stroke="#ccc" stroke-width="1.5"/>
  <!-- Window panes -->
  <line x1="95" y1="108" x2="95" y2="178" stroke="#ddd" stroke-width="1"/>
  <line x1="65" y1="143" x2="125" y2="143" stroke="#ddd" stroke-width="1"/>
  <!-- Warm interior light -->
  <rect x="66" y="109" width="58" height="68" rx="2" fill="#fff3e0" opacity="0.7"/>

  <!-- Large windows - right side -->
  <rect x="275" y="108" width="60" height="70" rx="3" fill="url(#window-grad)" stroke="#ccc" stroke-width="1.5"/>
  <line x1="305" y1="108" x2="305" y2="178" stroke="#ddd" stroke-width="1"/>
  <line x1="275" y1="143" x2="335" y2="143" stroke="#ddd" stroke-width="1"/>
  <rect x="276" y="109" width="58" height="68" rx="2" fill="#fff3e0" opacity="0.7"/>

  <!-- Center entrance area -->
  <!-- Entrance arch/frame -->
  <rect x="158" y="95" width="84" height="5" fill="#d8d8d8"/>
  <!-- Orange door -->
  <rect x="168" y="155" width="28" height="60" rx="3" fill="#E8751A"/>
  <rect x="200" y="155" width="28" height="60" rx="3" fill="#E8751A"/>
  <!-- Door handles -->
  <rect x="193" y="181" width="6" height="3" rx="1.5" fill="#c96010"/>
  <rect x="201" y="181" width="6" height="3" rx="1.5" fill="#c96010"/>
  <!-- Door window panes (small) -->
  <rect x="172" y="160" width="20" height="16" rx="2" fill="#fff8f0" opacity="0.6"/>
  <rect x="204" y="160" width="20" height="16" rx="2" fill="#fff8f0" opacity="0.6"/>
  <!-- Door steps -->
  <rect x="155" y="213" width="90" height="6" rx="2" fill="#d0d0d0"/>
  <rect x="158" y="219" width="84" height="4" rx="1" fill="#c8c8c8"/>

  <!-- Clinic sign above entrance -->
  <rect x="148" y="98" width="104" height="28" rx="4" fill="#3A3A3A"/>
  <text x="200" y="111" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#5B8533" text-anchor="middle">Motion</text>
  <text x="200" y="122" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#E8751A" text-anchor="middle">Works</text>

  <!-- Landscaping shrubs left -->
  <ellipse cx="85" cy="218" rx="28" ry="16" fill="#5B8533"/>
  <ellipse cx="62" cy="220" rx="20" ry="13" fill="#4d7228"/>
  <ellipse cx="110" cy="219" rx="20" ry="13" fill="#4d7228"/>
  <ellipse cx="85" cy="212" rx="22" ry="12" fill="#6a9a3d"/>

  <!-- Landscaping shrubs right -->
  <ellipse cx="315" cy="218" rx="28" ry="16" fill="#5B8533"/>
  <ellipse cx="292" cy="220" rx="20" ry="13" fill="#4d7228"/>
  <ellipse cx="338" cy="219" rx="20" ry="13" fill="#4d7228"/>
  <ellipse cx="315" cy="212" rx="22" ry="12" fill="#6a9a3d"/>

  <!-- Small center shrub -->
  <ellipse cx="200" cy="220" rx="18" ry="10" fill="#5B8533"/>
  <ellipse cx="200" cy="215" rx="14" ry="8" fill="#6a9a3d"/>
</svg>

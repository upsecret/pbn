<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f4f8"/>
    </linearGradient>
    <radialGradient id="heal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E8751A;stop-opacity:0.4"/>
      <stop offset="60%" style="stop-color:#E8751A;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#E8751A;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="260" fill="url(#bg-grad)"/>

  <!-- Subtle gradient relief lines in background -->
  <g stroke="#e8eef4" stroke-width="1" opacity="0.7">
    <path d="M0 80 Q200 60 400 80"/>
    <path d="M0 120 Q200 100 400 120"/>
    <path d="M0 160 Q200 140 400 160"/>
    <path d="M0 200 Q200 180 400 200"/>
  </g>

  <!-- Torso outline (front/slightly angled view) -->
  <!-- Shoulder line -->
  <path d="M130 60 Q200 50 270 60 L278 130 Q270 200 250 230 L200 240 L150 230 Q130 200 122 130 Z" fill="#e8e8e8" stroke="#D0D0D0" stroke-width="2"/>
  <!-- Neck -->
  <rect x="183" y="42" width="34" height="22" rx="6" fill="#d8d8d8" stroke="#D0D0D0" stroke-width="1.5"/>
  <!-- Shoulder rounded edges -->
  <ellipse cx="134" cy="80" rx="20" ry="30" fill="#e8e8e8" stroke="#D0D0D0" stroke-width="1.5"/>
  <ellipse cx="266" cy="80" rx="20" ry="30" fill="#e8e8e8" stroke="#D0D0D0" stroke-width="1.5"/>

  <!-- Spine column - vertebrae -->
  <!-- Cervical vertebrae (neck) -->
  <g fill="#4A4A4A">
    <rect x="189" y="52" width="22" height="8" rx="2"/>
    <rect x="189" y="62" width="22" height="8" rx="2"/>
    <rect x="189" y="72" width="22" height="8" rx="2"/>
  </g>
  <!-- Thoracic vertebrae -->
  <g fill="#4A4A4A">
    <rect x="187" y="88" width="26" height="9" rx="2"/>
    <rect x="187" y="100" width="26" height="9" rx="2"/>
    <rect x="187" y="112" width="26" height="9" rx="2"/>
    <rect x="187" y="124" width="26" height="9" rx="2"/>
    <rect x="187" y="136" width="26" height="9" rx="2"/>
    <rect x="187" y="148" width="26" height="9" rx="2"/>
    <rect x="187" y="160" width="26" height="9" rx="2"/>
  </g>
  <!-- Lumbar vertebrae -->
  <g fill="#4A4A4A">
    <rect x="185" y="175" width="30" height="11" rx="3"/>
    <rect x="185" y="189" width="30" height="11" rx="3"/>
    <rect x="185" y="203" width="30" height="11" rx="3"/>
    <!-- Sacrum -->
    <path d="M183 217 Q200 215 217 217 L215 235 Q200 240 185 235 Z" fill="#4A4A4A"/>
  </g>

  <!-- Spine center line (cord) -->
  <line x1="200" y1="50" x2="200" y2="217" stroke="#6a6a6a" stroke-width="2" stroke-dasharray="3,5" opacity="0.4"/>

  <!-- Vertebral processes (wings on sides) -->
  <g fill="#5a5a5a" opacity="0.6">
    <!-- Thoracic processes -->
    <rect x="178" y="90" width="8" height="5" rx="1"/>
    <rect x="214" y="90" width="8" height="5" rx="1"/>
    <rect x="178" y="102" width="8" height="5" rx="1"/>
    <rect x="214" y="102" width="8" height="5" rx="1"/>
    <rect x="178" y="114" width="8" height="5" rx="1"/>
    <rect x="214" y="114" width="8" height="5" rx="1"/>
    <rect x="178" y="126" width="8" height="5" rx="1"/>
    <rect x="214" y="126" width="8" height="5" rx="1"/>
    <rect x="178" y="138" width="8" height="5" rx="1"/>
    <rect x="214" y="138" width="8" height="5" rx="1"/>
    <!-- Lumbar processes -->
    <rect x="175" y="177" width="10" height="7" rx="1"/>
    <rect x="215" y="177" width="10" height="7" rx="1"/>
    <rect x="175" y="191" width="10" height="7" rx="1"/>
    <rect x="215" y="191" width="10" height="7" rx="1"/>
  </g>

  <!-- Healing glow on highlighted L2 vertebra (treatment area) -->
  <ellipse cx="200" cy="194" rx="40" ry="22" fill="url(#heal-glow)"/>

  <!-- Highlighted/treatment vertebra - bright orange -->
  <rect x="185" y="189" width="30" height="11" rx="3" fill="#E8751A"/>
  <!-- Glow ring -->
  <rect x="183" y="187" width="34" height="15" rx="4" fill="none" stroke="#E8751A" stroke-width="1.5" opacity="0.5"/>
  <rect x="181" y="185" width="38" height="19" rx="5" fill="none" stroke="#E8751A" stroke-width="1" opacity="0.25"/>

  <!-- Intervertebral discs (small lighter areas between vertebrae) -->
  <g fill="#c8d4dc" opacity="0.8">
    <rect x="188" y="83" width="24" height="4" rx="2"/>
    <rect x="188" y="95" width="24" height="4" rx="2"/>
    <rect x="188" y="107" width="24" height="4" rx="2"/>
    <rect x="188" y="119" width="24" height="4" rx="2"/>
    <rect x="188" y="131" width="24" height="4" rx="2"/>
    <rect x="188" y="143" width="24" height="4" rx="2"/>
    <rect x="188" y="155" width="24" height="4" rx="2"/>
    <rect x="188" y="169" width="24" height="4" rx="2"/>
    <rect x="188" y="183" width="24" height="4" rx="2"/>
    <rect x="188" y="197" width="24" height="4" rx="2"/>
    <rect x="188" y="211" width="24" height="4" rx="2"/>
  </g>

  <!-- Relief gradient lines suggesting improvement -->
  <g stroke="#E8751A" stroke-width="1" fill="none" opacity="0.2">
    <path d="M80 194 Q130 188 175 194"/>
    <path d="M225 194 Q270 188 320 194"/>
    <path d="M95 204 Q140 198 175 204"/>
    <path d="M225 204 Q260 198 305 204"/>
  </g>
</svg>

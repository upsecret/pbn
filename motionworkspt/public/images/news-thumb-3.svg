<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f0e0"/>
      <stop offset="100%" style="stop-color:#c0dcc0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="220" fill="url(#bg-grad)"/>

  <!-- Subtle green pattern lines -->
  <g stroke="#b0d0b0" stroke-width="0.8" opacity="0.5">
    <line x1="0" y1="55" x2="400" y2="55"/>
    <line x1="0" y1="110" x2="400" y2="110"/>
    <line x1="0" y1="165" x2="400" y2="165"/>
  </g>

  <!-- Ground/track line -->
  <line x1="50" y1="195" x2="350" y2="195" stroke="#90b890" stroke-width="2"/>

  <!-- Speed lines behind runner -->
  <g stroke="#E8751A" fill="none" opacity="0.4">
    <line x1="55" y1="85" x2="130" y2="85" stroke-width="2.5"/>
    <line x1="45" y1="100" x2="128" y2="100" stroke-width="2"/>
    <line x1="58" y1="115" x2="132" y2="115" stroke-width="2.5"/>
    <line x1="50" y1="130" x2="130" y2="130" stroke-width="1.5"/>
    <line x1="60" y1="145" x2="133" y2="145" stroke-width="2"/>
    <line x1="48" y1="160" x2="130" y2="160" stroke-width="2.5"/>
    <line x1="55" y1="175" x2="132" y2="175" stroke-width="1.5"/>
  </g>

  <!-- Running athlete silhouette (dynamic pose) -->
  <!-- Head -->
  <circle cx="235" cy="55" r="17" fill="#4A4A4A"/>
  <!-- Neck -->
  <rect x="229" y="70" width="12" height="11" fill="#4A4A4A"/>
  <!-- Torso (leaning forward) -->
  <path d="M220 80 Q238 75 250 83 L253 150 L215 150 Z" fill="#4A4A4A" transform="rotate(-6, 234, 115)"/>
  <!-- Right arm (forward) -->
  <path d="M248 88 Q265 75 278 64" stroke="#4A4A4A" stroke-width="11" fill="none" stroke-linecap="round" transform="rotate(-6, 234, 115)"/>
  <circle cx="278" cy="63" r="6" fill="#4A4A4A"/>
  <!-- Left arm (back) -->
  <path d="M222 93 Q200 108 184 120" stroke="#4A4A4A" stroke-width="11" fill="none" stroke-linecap="round" transform="rotate(-6, 234, 115)"/>
  <circle cx="183" cy="121" r="6" fill="#4A4A4A"/>
  <!-- Right leg (front, lifted) -->
  <path d="M242 145 L262 178 L272 195" stroke="#4A4A4A" stroke-width="13" fill="none" stroke-linecap="round"/>
  <ellipse cx="275" cy="196" rx="16" ry="5" fill="#3a3a3a"/>
  <!-- Left leg (back, pushing off) -->
  <path d="M222 145 L205 185" stroke="#4A4A4A" stroke-width="13" fill="none" stroke-linecap="round"/>
  <ellipse cx="203" cy="188" rx="16" ry="5" fill="#3a3a3a"/>

  <!-- Shield/protection symbol (orange accent) -->
  <g transform="translate(310, 28)">
    <!-- Shield shape -->
    <path d="M35 0 L70 12 L70 42 Q70 65 35 78 Q0 65 0 42 L0 12 Z" fill="#E8751A" opacity="0.9"/>
    <!-- Shield inner -->
    <path d="M35 8 L62 18 L62 42 Q62 61 35 72 Q8 61 8 42 L8 18 Z" fill="#c96010" opacity="0.5"/>
    <!-- Checkmark on shield -->
    <polyline points="20,40 30,52 52,28" stroke="white" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Orange accent dots -->
  <g fill="#E8751A" opacity="0.4">
    <circle cx="65" cy="35" r="3"/>
    <circle cx="78" cy="22" r="2"/>
    <circle cx="55" cy="22" r="1.5"/>
    <circle cx="330" cy="185" r="2.5"/>
    <circle cx="345" cy="175" r="1.5"/>
  </g>

  <!-- "Sports Injury Prevention" label at bottom -->
  <text x="200" y="213" font-family="Arial, sans-serif" font-size="9" fill="#5B8533" text-anchor="middle" opacity="0.8" letter-spacing="1">SPORTS INJURY PREVENTION</text>
</svg>

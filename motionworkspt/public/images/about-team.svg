<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f4f0"/>
      <stop offset="100%" style="stop-color:#ede8e0"/>
    </linearGradient>
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0ece8"/>
      <stop offset="100%" style="stop-color:#e8e0d8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" fill="url(#bg-grad)"/>

  <!-- Clinic interior background - wall -->
  <rect x="0" y="0" width="600" height="230" fill="url(#wall-grad)"/>
  <!-- Floor -->
  <rect x="0" y="230" width="600" height="70" fill="#ddd4c8"/>
  <!-- Floor/wall baseboard -->
  <rect x="0" y="226" width="600" height="6" fill="#c8bfb5"/>

  <!-- Window suggestion - left -->
  <rect x="40" y="20" width="80" height="130" rx="3" fill="#d4eaf7" stroke="#c8bab0" stroke-width="2"/>
  <line x1="80" y1="20" x2="80" y2="150" stroke="#c8bab0" stroke-width="1.5"/>
  <line x1="40" y1="85" x2="120" y2="85" stroke="#c8bab0" stroke-width="1.5"/>
  <!-- Window light -->
  <rect x="41" y="21" width="78" height="128" rx="2" fill="#e8f4fc" opacity="0.6"/>

  <!-- Window suggestion - right -->
  <rect x="480" y="20" width="80" height="130" rx="3" fill="#d4eaf7" stroke="#c8bab0" stroke-width="2"/>
  <line x1="520" y1="20" x2="520" y2="150" stroke="#c8bab0" stroke-width="1.5"/>
  <line x1="480" y1="85" x2="560" y2="85" stroke="#c8bab0" stroke-width="1.5"/>
  <rect x="481" y="21" width="78" height="128" rx="2" fill="#e8f4fc" opacity="0.6"/>

  <!-- Wall accent line -->
  <line x1="0" y1="170" x2="600" y2="170" stroke="#d8d0c8" stroke-width="1"/>

  <!-- LEFT FIGURE - Female in teal scrubs -->
  <!-- Shadow -->
  <ellipse cx="175" cy="240" rx="32" ry="8" fill="#c8bfb5" opacity="0.5"/>
  <!-- Legs -->
  <rect x="162" y="185" width="14" height="55" rx="5" fill="#2a8080"/>
  <rect x="180" y="185" width="14" height="55" rx="5" fill="#2a8080"/>
  <!-- Feet -->
  <ellipse cx="169" cy="241" rx="11" ry="5" fill="#3a3a3a"/>
  <ellipse cx="187" cy="241" rx="11" ry="5" fill="#3a3a3a"/>
  <!-- Torso/scrub top -->
  <path d="M158 110 L198 110 L202 188 L154 188 Z" fill="#2a9090"/>
  <!-- Arms -->
  <path d="M160 118 Q142 135 138 160" stroke="#2a9090" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M196 118 Q214 135 218 160" stroke="#2a9090" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Hands -->
  <circle cx="138" cy="162" r="7" fill="#c8956a"/>
  <circle cx="218" cy="162" r="7" fill="#c8956a"/>
  <!-- Neck -->
  <rect x="172" y="95" width="12" height="18" fill="#c8956a"/>
  <!-- Head -->
  <circle cx="178" cy="80" r="22" fill="#c8956a"/>
  <!-- Hair (long, female) -->
  <path d="M156 70 Q155 110 160 130" stroke="#4a3020" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M200 70 Q202 110 198 130" stroke="#4a3020" stroke-width="8" fill="none" stroke-linecap="round"/>
  <ellipse cx="178" cy="62" rx="22" ry="8" fill="#4a3020"/>
  <!-- Smile -->
  <path d="M170 84 Q178 90 186 84" stroke="#8a5030" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="172" cy="78" r="2.5" fill="#3a2010"/>
  <circle cx="184" cy="78" r="2.5" fill="#3a2010"/>
  <!-- Scrub collar/V-neck -->
  <path d="M168 112 L178 122 L188 112" stroke="#1a7070" stroke-width="2" fill="none"/>

  <!-- CENTER FIGURE - Male in dark navy scrubs (taller) -->
  <!-- Shadow -->
  <ellipse cx="300" cy="240" rx="35" ry="8" fill="#c8bfb5" opacity="0.5"/>
  <!-- Legs -->
  <rect x="286" y="185" width="14" height="60" rx="5" fill="#1a2050"/>
  <rect x="305" y="185" width="14" height="60" rx="5" fill="#1a2050"/>
  <!-- Feet -->
  <ellipse cx="293" cy="246" rx="12" ry="5" fill="#2a2a2a"/>
  <ellipse cx="312" cy="246" rx="12" ry="5" fill="#2a2a2a"/>
  <!-- Torso/scrub top (taller torso) -->
  <path d="M280 100 L325 100 L330 188 L275 188 Z" fill="#1a2060"/>
  <!-- Arms -->
  <path d="M283 110 Q262 128 258 155" stroke="#1a2060" stroke-width="13" fill="none" stroke-linecap="round"/>
  <path d="M322 110 Q342 128 345 155" stroke="#1a2060" stroke-width="13" fill="none" stroke-linecap="round"/>
  <!-- Hands -->
  <circle cx="257" cy="157" r="8" fill="#b88050"/>
  <circle cx="346" cy="157" r="8" fill="#b88050"/>
  <!-- Neck -->
  <rect x="293" y="82" width="14" height="20" fill="#b88050"/>
  <!-- Head (slightly larger for male) -->
  <circle cx="300" cy="64" r="24" fill="#b88050"/>
  <!-- Hair (short, male) -->
  <ellipse cx="300" cy="43" rx="24" ry="8" fill="#3a2510"/>
  <rect x="276" y="44" width="48" height="10" fill="#3a2510"/>
  <!-- Smile -->
  <path d="M291 68 Q300 75 309 68" stroke="#7a4020" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="294" cy="61" r="2.5" fill="#2a1808"/>
  <circle cx="306" cy="61" r="2.5" fill="#2a1808"/>
  <!-- Scrub V-neck -->
  <path d="M290 103 L300 115 L310 103" stroke="#0a1040" stroke-width="2" fill="none"/>
  <!-- Stethoscope hint -->
  <path d="M292 118 Q290 130 295 138" stroke="#888" stroke-width="2.5" fill="none"/>
  <circle cx="296" cy="140" r="4" fill="#888"/>

  <!-- RIGHT FIGURE - Female in green scrubs -->
  <!-- Shadow -->
  <ellipse cx="425" cy="240" rx="32" ry="8" fill="#c8bfb5" opacity="0.5"/>
  <!-- Legs -->
  <rect x="412" y="185" width="14" height="55" rx="5" fill="#3a6a28"/>
  <rect x="430" y="185" width="14" height="55" rx="5" fill="#3a6a28"/>
  <!-- Feet -->
  <ellipse cx="419" cy="241" rx="11" ry="5" fill="#3a3a3a"/>
  <ellipse cx="437" cy="241" rx="11" ry="5" fill="#3a3a3a"/>
  <!-- Torso/scrub top -->
  <path d="M408 112 L448 112 L452 188 L404 188 Z" fill="#4a7a38"/>
  <!-- Arms -->
  <path d="M410 120 Q392 138 388 163" stroke="#4a7a38" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M446 120 Q464 138 468 163" stroke="#4a7a38" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Hands -->
  <circle cx="388" cy="165" r="7" fill="#d4a070"/>
  <circle cx="468" cy="165" r="7" fill="#d4a070"/>
  <!-- Neck -->
  <rect x="422" y="97" width="12" height="18" fill="#d4a070"/>
  <!-- Head -->
  <circle cx="428" cy="82" r="22" fill="#d4a070"/>
  <!-- Hair (medium length, slightly lighter) -->
  <ellipse cx="428" cy="63" rx="22" ry="8" fill="#6a4530"/>
  <path d="M406 72 Q405 105 410 122" stroke="#6a4530" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M450 72 Q452 108 448 122" stroke="#6a4530" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M420 86 Q428 92 436 86" stroke="#9a6040" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="422" cy="80" r="2.5" fill="#3a2010"/>
  <circle cx="434" cy="80" r="2.5" fill="#3a2010"/>
  <!-- Scrub collar -->
  <path d="M418 114 L428 124 L438 114" stroke="#3a6018" stroke-width="2" fill="none"/>

  <!-- MotionWorks logo text below figures -->
  <rect x="195" y="252" width="210" height="32" rx="4" fill="white" opacity="0.7"/>
  <text x="265" y="272" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5B8533">Motion</text>
  <text x="323" y="272" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E8751A">Works</text>
  <text x="300" y="283" font-family="Arial, sans-serif" font-size="7" fill="#888888" text-anchor="middle" letter-spacing="2">PHYSICAL THERAPY</text>
</svg>
